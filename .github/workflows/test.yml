name: Frontend Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint || true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npx jest --coverage --coverageReporters=text --coverageReporters=lcov --coverageReporters=json-summary --passWithNoTests
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3007/v1

      - name: Check coverage thresholds
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "No coverage report found (no tests yet). Skipping threshold check."
            exit 0
          fi
          node -e "
            const summary = require('./coverage/coverage-summary.json');
            const { lines, branches, functions, statements } = summary.total;
            const MIN = 70;
            let failed = false;

            for (const [metric, data] of Object.entries({ lines, branches, functions, statements })) {
              const pct = data.pct;
              const status = pct >= MIN ? 'PASS' : 'FAIL';
              console.log(\`\${status}: \${metric} = \${pct}% (threshold: \${MIN}%)\`);
              if (pct < MIN) failed = true;
            }

            if (failed) {
              console.error('Coverage below minimum threshold of ' + MIN + '%');
              process.exit(1);
            }
            console.log('All coverage thresholds met.');
          "

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 14

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3007/v1
